<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Display</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #2a303c;
            display: flex;
            flex-direction: column;
        }

        h1 {
            color: white;
            margin: 10px;
            flex: 0 0 auto;
        }

        #svg-container {
            flex: 1 1 auto;
            min-height: 0; /* Important for Firefox */
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #controls {
            flex: 0 0 auto;
            padding: 20px;
            background-color: #353b48;
            color: white;
        }

        .highlighted-element {
            fill: yellow !important;
            stroke: orange !important;
            stroke-width: 2px !important;
        }

        .highlighted-actor {
            fill: #ffebcd !important;
            stroke: #deb887 !important;
        }

        button {
            padding: 8px 16px;
            margin-right: 10px;
            background-color: #4a5568;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2d3748;
        }

        #currentEvent {
            margin-top: 10px;
            padding: 10px;
            background-color: #2d3748;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre;
        }
    </style>
</head>

// Function to process Redis events
function processEvents(events) {
  return events.map(event => {
    const mapping = eventMapping[event.type || event.action];
    if(mapping) {
      return {
        ...event,
        svgElement: mapping.svgElement,
        flow: mapping.flow,
        fromActor: mapping.fromActor,
        toActor: mapping.toActor,
        timestamp: new Date(event.timestamp).toLocaleTimeString()
      };
    }
    return event;
  });
}

// Function to highlight elements
function highlightElement(elementId) {
  const element = document.getElementById(elementId);
  if(element) {
    // Remove previous highlights
    document.querySelectorAll('.highlighted').forEach(el => {
      el.classList.remove('highlighted');
    });
    // Add highlight
    element.classList.add('highlighted');
  }
}

// Add navigation handlers
let currentEventIndex = -1;

function updateDisplay() {
  const event = sampleRedisAnswer[currentEventIndex];
  const stepCounter = document.getElementById('stepCounter');
  const currentEventDisplay = document.getElementById('currentEvent');
  
  stepCounter.textContent = `Step ${currentEventIndex + 1} of ${sampleRedisAnswer.length}`;
  
  if (event) {
    // Format and display current event
    const timeString = new Date(event.timestamp).toLocaleTimeString();
    currentEventDisplay.textContent = JSON.stringify({
      time: timeString,
      type: event.type || event.action,
      component: event.component,
      thingName: event.thingName
    }, null, 2);

    // Highlight relevant elements
    highlightStep(event);
  }
}

function nextStep() {
  if (currentEventIndex < sampleRedisAnswer.length - 1) {
    currentEventIndex++;
    updateDisplay();
  }
}

function previousStep() {
  if (currentEventIndex > 0) {
    currentEventIndex--;
    updateDisplay();
  }
}

// Remove the old highlightElement function since we're using the new highlightStep
function highlightStep(event) {
  console.log('Highlighting step for event:', event);
  const mapping = eventMapping[event.type || event.action];
  if (mapping) {
    console.log('Found mapping:', mapping);
    
    // First remove previous element highlights
    document.querySelectorAll('.highlighted-element').forEach(el => {
      el.classList.remove('highlighted-element');
    });

    // Then remove previous actor highlights
    document.querySelectorAll('.highlighted-actor').forEach(el => {
      el.classList.remove('highlighted-actor');
    });
    
    // Highlight the message/element
    const element = document.getElementById(mapping.svgElement);
    if (element) {
      element.classList.add('highlighted-element');
      console.log(`Highlighted element: ${mapping.svgElement}`);
    } else {
      console.log(`Element not found: ${mapping.svgElement}`);

    // Highlight the actors

      }
      if (fromActorBottom) {
        fromActorBottom.classList.add('highlighted-actor');
        console.log(`Highlighted from actor bottom: ${svgStructure.actors[mapping.fromActor].bottom}`);
      }
    }
    
    if (mapping.toActor) {
      const toActorTop = document.getElementById(svgStructure.actors[mapping.toActor].top);
      const toActorBottom = document.getElementById(svgStructure.actors[mapping.toActor].bottom);
      if (toActorTop) {

      }
    }
  } else {
    console.log('No mapping found for event type:', event.type || event.action);
  }
}
